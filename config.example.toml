inputs = ["downloads"]
output = "repository"
# input_mode = "files" # Default: "archives"; files mode sorts ZIPs as files too
# zip = true # output must then name a new ZIP file, e.g. "sorted.zip"
# zip_dirs = ["documents/pdf", "other"] # Enables ZIP output for these sorted directories
# zip_each_dir = true # Separate ZIPs in a new output directory; all top-level dirs if none selected
# output_password_file = "output-password.txt" # 0600, exactly one nonempty line
# staging_dir = "/path/to/encrypted/scratch" # Existing directory for ZIP/preview staging
recursive = true
workers = 4
# password_file = "passwords.txt" # Private local file, one candidate per line
# rules = "rules.toml"

[security]
mode = "sealed"
restrict_directories = true
allow_automatic_unsealing = false

[limits]
max_entry_bytes = 268435456
max_archive_bytes = 1073741824
max_input_bytes = 1073741824
max_entries = 10000
max_expansion_ratio = 1000
