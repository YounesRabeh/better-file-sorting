# REGULAR-FILE SORTING POLICY — preserve names without extracting ZIP files.
# Usage: bfsort ingest ./documents --input-mode files --rules rules.files.toml
# This is a rules file, not a --config runtime file.
# Reference: docs/configuration.md#sorting-rule-settings.

# Rules schema version; currently only version 1 is supported.
version = 1

# Use with --input-mode files; archive-derived records require the samples policy.
[organization]
# Use samples to enforce .sample names; regular preserves ordinary names in files mode only.
filename_policy = "regular"
# Keep the first identical payload; alternatives are all, only_duplicates, or separate.
duplicates = "first_only"
# Use hardlink for links to stored payloads (retaining permissions), or manifest for metadata only.
view_mode = "hardlink"
# Destination directory template used when no matching rule overrides it.
default_directory = "{file_type}"
# Destination filename template used when no matching rule overrides it.
default_filename = "{original_name}"

[[rules]]
# Human-readable rule label; rules are evaluated in order and the first match wins.
name = "PDF documents"
[rules.match]
# Match the original filename extension case-insensitively, without a leading dot.
original_extension = "pdf"
[rules.output]
# Sorted destination directory template for entries matching this rule.
directory = "documents/pdf"
# Preserve the original filename for matching ordinary files; collisions are resolved by bfsort.
filename = "{original_name}"
