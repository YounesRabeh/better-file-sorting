# LOCAL INGEST — input paths, output, workers, security and extraction limits.
# Usage: bfsort ingest -c config.toml
# Ingest defaults to ordinary files. Pass --extract to open ZIP contents.
# Sorting rules belong in a separate file referenced by rules below.
# Reference: docs/configuration.md; CLI overrides TOML.

# Local files or directories to ingest; explicit inputs take precedence over download receipts.
inputs = ["incoming"]
# Destination repository, ZIP file, or new directory for separate ZIP exports.
output = "organized"
# Use archives to extract ZIP entries, or files to sort ordinary files (including ZIPs unchanged).
# input_mode = "files"
# Export a ZIP instead of a repository; output must name a new ZIP file.
# zip = true
# Export these sorted directories and descendants; selecting directories enables ZIP output.
# zip_dirs = ["documents/pdf", "other"]
# Create one ZIP per selected directory, or per top-level sorted directory if none are selected.
# zip_each_dir = true
# Private 0600 file containing exactly one nonempty password for AES-256 ZIP output.
# output_password_file = "output-password.txt"
# Existing scratch directory for private ZIP-export and preview temporary storage.
# staging_dir = "/path/to/encrypted/scratch"
# Local discovery and parallel ingest
# Search input directories recursively rather than only their immediate children.
recursive = true
# Number of parallel ingest workers; valid range is 1 to 256.
workers = 4
preset = "by-format"
# resume = true
# Private 0600 file containing candidate input ZIP passwords, one per line.
# password_file = "passwords.txt"
# Path to the TOML policy defining matching, destination paths and duplicate handling.
# rules = "rules.toml"

# Repository permissions
[security]
# Use sealed for payload permissions 0000, or standard for owner read/write permissions 0600.
mode = "sealed"
# Require owner-only directories (0700); disabling this safeguard is rejected.
restrict_directories = true
# Must remain false; bfsort never automatically restores access to sealed payloads.
allow_automatic_unsealing = false

# Optional extraction budgets are omitted: no application size/count/ratio caps.
# Use examples/bounded.toml to opt into finite budgets.
# [limits]
# max_entry_bytes = "256 MiB"
# max_archive_bytes = "1 GiB"
# max_entries = 10000
