# The limits below are an opt-in bounded preset; bare bfsort download has no byte/count caps.
# WEB COLLECTION — discover ZIP links, download sealed payloads, then ingest.
# Usage: bfsort collect -c collection.toml
# --dry-run may request HTML metadata, but never downloads payloads.
# Explicitly unlock completed payloads before bfsort ingest --config collection.toml.
# No inputs field: ingest uses verified completion receipts.
# Reference: docs/configuration.md and docs/commands.md#acquisition-commands.

# Run from the directory against which these paths should resolve.
# Use archives to extract ZIP entries, or files to sort ordinary files (including ZIPs unchanged).
input_mode = "archives"
# Destination repository, ZIP file, or new directory for separate ZIP exports.
output = "./sorted.zip"
# Export a ZIP instead of a repository; output must name a new ZIP file.
zip = true
# Path to the TOML policy defining matching, destination paths and duplicate handling.
rules = "./examples/rules.example.toml"

# Stage 1: page discovery
[source]
# HTTP(S) page to scan for direct ZIP links; credentials and query strings are unsupported.
page = "https://example.org/downloads/"
# Restrict resource links and redirects to the page origin; HTTPS downgrades are always refused.
same_origin = true
# Sizes accept readable units or integer bytes.
# Maximum downloaded HTML page body; accepts readable units or integer bytes.
max_page_size = "10 MB"

# Stage 2: persistent downloads and shared transfer budgets
[download]
# Path to the versioned discovery inventory (a JSON object despite the .jsonl suffix).
inventory = "./collection/inventory.jsonl"
# Private download root containing sealed payloads and completion receipts; files require explicit unlocking before ingest.
staging_dir = "./collection/downloads"
# Maximum uncached candidates attempted in one download invocation.
max_files = 100
# Maximum downloaded bytes per resource, independent of extraction limits.
max_file_size = "1 GB"
# Aggregate resource-body byte budget per invocation, including failed transfers.
max_total_size = "10 GB"
# Maximum managed payload storage, including completed files and leftover partials.
max_staging_size = "20 GB"
# Number of parallel download workers sharing all speed, request and byte limits.
concurrency = 3
# Transfer timeout in seconds, including time spent waiting for pacing.
timeout_seconds = 300
# Omit any of these optional caps for unrestricted speed/request count.
# Aggregate download speed, e.g. 2 MB/s or 2 MiB/s; integer bytes/second also works; omit for no cap.
# max_speed = "2 MB/s"
# Minimum milliseconds between HTTP request starts across workers; zero disables spacing.
# min_request_interval_ms = 1000
# Maximum HTTP requests per command invocation, including redirects; omit for no cap.
# max_requests = 100
# Preserve website order; use "name" only to change download execution priority.
order_by = "source"
# Sort download priority in ascending or descending order before selecting candidates.
order = "ascending"
# Literal relative folder beneath staging_dir/payloads; empty uses payloads directly.
directory = "malware-bazaar-daily"
# Download basenames only; discovery always lists original names.
filename = "{original_name}"
# filename = "{name}-{source_id}"
# filename = "{source_id}"

# Download selection policies (not extracted-content sorting rules)
# Exclusions win; when includes exist, at least one must match.
# [[download.policies]]
# Match original resource filenames case-insensitively.
# name_contains = "Linux"
# Include or exclude matching downloads; if include policies exist, at least one must match.
# action = "include"
# [[download.policies]]
# Match resource filenames case-insensitively; one match per policy.
# name_contains = "deprecated"
# Include or exclude matching downloads; if include policies exist, at least one must match.
# action = "exclude"
