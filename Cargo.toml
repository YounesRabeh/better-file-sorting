[package]
name = "malware-organizer"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Metadata-driven, permission-restricted ZIP sample organizer"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
zip = { version = "=9.1.3", default-features = false, features = ["deflate", "aes-crypto"] }
walkdir = "2"
sha2 = "0.11"
infer = "0.22"
tempfile = "3"
rayon = "1"
chrono = "0.4"
unicode-normalization = "0.1"
ctrlc = "3"


[[bench]]
name = "throughput"
harness = false
