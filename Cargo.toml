[package]
name = "bfs"
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Metadata-driven, permission-restricted ZIP sample organizer"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
zip = { version = "=9.1.3", default-features = false, features = ["deflate", "aes-crypto"] }
walkdir = "2"
sha2 = "0.11"
infer = "0.22"
tempfile = "3"
rayon = "1"
chrono = "0.4"
unicode-normalization = "0.1"
ctrlc = "3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
scraper = { version = "0.24", default-features = false }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }


[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "detection"
harness = false

[[bin]]
name = "bfsort"
path = "src/main.rs"
